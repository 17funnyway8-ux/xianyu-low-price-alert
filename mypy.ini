# mypy 配置 —— 类型检查门禁（引入于 M1）
# 目标：核心包（xianyu_alert 业务逻辑）与 Web 层零错误。
# GUI 层（Tk gui/ 包 / Qt gui_qt）当前豁免，原因见文末说明。

[mypy]
python_version = 3.13
files = xianyu_alert, web
ignore_missing_imports = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^re_analysis/|^scripts/)

# ---- 以下为「已登记的技术债」，M3 阶段消除 ----
# GUI 层问题（M3 处理，需配合拆分 gui.py 与 Qt 测试补强，避免盲改未覆盖代码）：
#   gui/（Tk）     : 20 处（Treeview 重载、lambda 推断、list[str] | None 收窄等）
#   gui_qt/app.py  : 8 处 sqlite3.Row.get() 误用（已修）+ None 收窄
#   gui_qt/tab_config.py : update_row 调用缺参/类型不符（疑似真实缺陷，待人工确认）
# 豁免期间这两块不进 CI 门禁；M3 完成拆分与补测后删除本段。
[mypy-xianyu_alert.gui]
ignore_errors = True

[mypy-xianyu_alert.gui_qt.*]
ignore_errors = True

# v1.9.5：gui.py 拆为 gui/ 包后，原 [mypy-xianyu_alert.gui] 规则不再覆盖子模块，
# 故补通配规则（豁免理由与单文件时期相同，见文末）。
[mypy-xianyu_alert.gui.*]
ignore_errors = True
