# ===========================================================
# CI —— push / PR 触发的质量门禁（引入于 M1）
# ===========================================================
# 三个 job：
#   quality   ruff + mypy（约 30 秒，快速失败）
#   test      三平台矩阵（ubuntu / windows / macos）跑全量单测
#   coverage  ubuntu 上跑覆盖率并卡门槛（整体 + 核心包）
#
# 依赖统一走 requirements-dev.txt，避免「流水线漏装测试依赖」类事故
# （v1.8.2 首次发布时因漏装 pytest 导致 Release 失败，已记录在案）。
# ===========================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Ruff lint（配置见 ruff.toml）
        run: ruff check xianyu_alert web tests scripts

      - name: Mypy type check（配置见 mypy.ini）
        run: mypy

      - name: 文档一致性校验（相对链接 / 仓库路径 / 版本标签 / 索引）
        run: python scripts/check_docs.py

      - name: Dependency audit（pip-audit，仅提示不阻断）
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-web.txt

  gui-qt:
    name: Qt GUI tests (offscreen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies + PySide6 + Qt 系统库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install "PySide6>=6.6"

      - name: Qt 用例（offscreen 平台，无需显示器）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_gui_qt*.py" -v

      # v1.10.9：gui_qt 此前**只有用例数、没有覆盖率门禁**（主门禁的环境没有 PySide6，
      # 该包被 --omit 排除）。这里在装了 PySide6 的作业里单独量一遍，
      # 让 Qt 版的质量也从"有测试"升级为"有可核对的数字"。
      - name: Qt 覆盖率门禁（gui_qt ≥ 60%）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m coverage run --source=xianyu_alert.gui_qt -m unittest discover -s tests -p "test_gui_qt*.py"
          python -m coverage report --fail-under=60

  web-e2e:
    name: Web UI contract + e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 jsdom（DOM e2e 依赖）
        run: npm ci

      - name: 前端与后端契约交叉校验（路由/通道/表单/记录字段）
        run: python scripts/check_web_contract.py

      - name: 真实 HTTP + SQLite 冒烟 e2e
        run: python scripts/e2e_web_smoke.py

      - name: DOM 级交互 e2e（jsdom）
        run: node scripts/e2e_web_dom.js

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Install xvfb（仅 Linux：Tk GUI 测试需要虚拟显示）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Unit tests（全 mock，无外网依赖）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests
          else
            python -m unittest discover -s tests
          fi

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Install xvfb（Tk GUI 测试需要虚拟显示）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests with coverage
        run: xvfb-run -a coverage run --source=xianyu_alert,web -m unittest discover -s tests

      - name: 整体覆盖率（防倒退，门槛 55%，当前 55.6%，目标 70%）
        run: coverage report --skip-empty --fail-under=55

      - name: 核心包覆盖率（门槛 77%，目标 80%；不含 GUI 层）
        run: |
          coverage report \
            --include="*/xianyu_alert/*,*/web/*" \
            --omit="*/gui/*,*/gui_qt/*" \
            --fail-under=77
