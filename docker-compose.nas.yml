# ===========================================================
# 闲鱼低价提醒工具 —— 飞牛 NAS 部署（docker-compose.nas.yml）
# ===========================================================
# 部署目标：飞牛 fnOS（x86_64，10.0.0.26，Docker 28.5.2 / Compose v2.40.3）
#
#   - 镜像：xianyu-alert:1.8.1-amd64
#     Mac 为 arm64、NAS 为 x86_64，故用 `docker buildx build --platform
#     linux/amd64` 交叉构建后 `docker save | ssh nas 'docker load'` 导入。
#   - 端口：宿主机 8899 → 容器 8080（8080 已被 qbittorrent 占用，
#     8188/8190 为 ComfyUI 与 gateway，均已在 2026-09 实测避开）。
#   - 数据：/vol1/1000/Docker/xianyu-alert/data → /app/data
#     ⚠️ 备份时必须 config.yaml + secret.key + state/ 三者一起，
#        缺 secret.key 则 fernet1: 密文 Cookie 永久无法解密。
#   - 认证：未启用 XY_WEB_TOKEN（仅内网使用；如需外网访问请取消注释并设强随机串）。
#
# 常用命令（在 /vol1/1000/Docker/xianyu-alert 下执行）：
#   docker compose -p xianyu-alert up -d        # 启动
#   docker compose -p xianyu-alert logs -f      # 查看日志
#   docker compose -p xianyu-alert down         # 停止（SIGTERM 优雅退出）
#   curl http://127.0.0.1:8899/healthz          # 健康检查
# ===========================================================

services:
  xianyu-alert:
    image: xianyu-alert:1.8.2-amd64
    container_name: xianyu-alert
    # 7×24 常驻：宿主机重启 / 容器崩溃自动拉起
    restart: unless-stopped
    environment:
      XY_DATA_DIR: /app/data      # paths.data_dir() 直通
      TZ: Asia/Shanghai           # 提醒时间正确（镜像内已装 tzdata）
      # XY_WEB_TOKEN: "change-me-随机串"   # 启用后除 /healthz、/、/static/* 外均需 Bearer
    ports:
      - "8899:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
