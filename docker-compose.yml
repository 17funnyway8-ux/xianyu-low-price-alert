# ===========================================================
# 闲鱼低价提醒工具 —— docker-compose.yml（P2/P3：Web 全功能常驻服务）
# ===========================================================
# P2/P3 语义：常驻 Web 服务（FastAPI :8080 + monitor 后台线程）。
#
# ⚠️ 项目名提示：若项目目录名含中文/空格/非 ASCII，docker compose 会报
#    `project name must not be empty`，必须在命令中显式指定项目名：
#      docker compose -p xianyu-alert <子命令>
#
# 常用命令：
#   docker compose -p xianyu-alert up -d --build     # 启动常驻 Web
#   curl http://127.0.0.1:8080/healthz               # 健康检查
#   docker compose -p xianyu-alert logs -f           # 查看容器日志
#   docker compose -p xianyu-alert down              # 停止（SIGTERM 优雅退出）
#
# 容器内 CLI 调试（Web 运行中不可 once/run，会抢单实例锁返回 2）：
#   docker compose -p xianyu-alert run --rm xianyu-alert cookie status --config config.example.yaml
#   docker compose -p xianyu-alert run --rm xianyu-alert list --config config.poc.yaml
#
# 远程访问（P3-01 认证）：
#   1) 把 ports 改为 "8080:8080"（暴露到局域网/公网）；
#   2) 取消下面 XY_WEB_TOKEN 注释并设置强随机串；
#   3) 可选再加 Caddy basic_auth / Tailscale 反向代理做第二层。
#   未设 token 时默认仅本机 127.0.0.1 访问，行为与 P1 一致。
#
# 数据卷：./xianyu-data:/app/data —— config.yaml / secret.key / state/ 全部落卷。
#   ⚠️ 备份时必须连同 secret.key 一起备份，否则 fernet1: 密文 Cookie 无法解密。
# ===========================================================

services:
  xianyu-alert:
    build: .
    image: xianyu-alert:1.8.0
    container_name: xianyu-alert
    # 7×24：宿主机重启 / 容器崩溃自动拉起（P3-03 确认保留）
    restart: unless-stopped
    environment:
      XY_DATA_DIR: /app/data        # paths.data_dir() 直通（v1.8 已支持，零改动）
      TZ: Asia/Shanghai             # 提醒记录时间正确（镜像内已装 tzdata）
      # XY_WEB_TOKEN: "change-me-随机串"  # P3-01：远程访问时启用 Bearer 认证
      #                                  #   设置后除 /healthz、/、/static/* 外全部要求
      #                                  #   Authorization: Bearer <token>
    ports:
      - "127.0.0.1:8080:8080"       # 默认仅本机；远程访问改 "8080:8080" + 开 token
    volumes:
      - ./xianyu-data:/app/data     # config.yaml / secret.key / state/ 全部落卷
    # 健康检查：HTTP /healthz（Web + monitor 线程存活）；**不得**用 cli once/run（抢锁）
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 日志轮转：容器 stdout（docker logs）+ 文件日志 state/xianyu_alert.log 双通道
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 单用户纯 Python + SQLite 资源上限（P3-03 确认保留）
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # 非 root 加固（P3-03 should，可选）：需卷属主对齐（默认卷属主为宿主机创建者）。
    # 启用前请先确认 ./xianyu-data 目录属主为 1000:1000（chown -R 1000:1000 xianyu-data）。
    # user: "1000:1000"
